apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
      - name: todo-app
        image: keerthanavishnu/todo-app:latest
        env:
        - name: DB_HOST
          value: postgres-service
        - name: DB_NAME
          value: tododb
        - name: DB_USER
          value: postgres
        - name: DB_PASSWORD
          value: postgres
        ports:
        - containerPort: 5000
